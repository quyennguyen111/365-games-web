<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game #7 - Logic Domino: Build the Chain</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #f1c40f; }

        /* Dashboard */
        .dashboard {
            margin-bottom: 20px;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            min-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .subtitle { font-size: 20px; margin-top: 10px; min-height: 30px; color: #3498db; }
        .controls button {
            padding: 10px 20px; margin: 0 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 5px;
            background: #e67e22; color: white; transition: 0.2s;
        }
        .controls button:hover { background: #d35400; }

        /* Play Area */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* The Chain Board */
        .chain-board {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background-color: #1abc9c;
            width: 90%;
            height: 150px;
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
            overflow-x: auto;
            gap: 10px;
        }

        /* Tray */
        .tray {
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            min-height: 120px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            flex-wrap: wrap;
        }

        /* Domino Tile */
        .domino {
            display: flex;
            width: 140px;
            height: 70px;
            background-color: #ecf0f1;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            cursor: grab;
            position: relative;
            transition: transform 0.2s;
            overflow: hidden;
        }
        .domino:active { cursor: grabbing; transform: scale(0.95); }
        .domino.fixed { cursor: default; }
        .domino.fixed:active { transform: none; }
        
        .domino .half {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            border-right: 2px solid #bdc3c7;
        }
        .domino .half:last-child { border-right: none; }
        
        .domino .half:hover { background-color: #bdc3c7; cursor: pointer; } /* for voice play */

        /* Drop Zone */
        .drop-zone {
            width: 140px;
            height: 70px;
            border: 2px dashed #f1c40f;
            border-radius: 8px;
            background: rgba(241, 196, 15, 0.2);
            display: none;
            justify-content: center;
            align-items: center;
            color: #f1c40f;
            font-weight: bold;
        }
        .drop-zone.active { display: flex; }
        .drop-zone.hover { background: rgba(241, 196, 15, 0.5); }

        /* Rotate button */
        .rotate-btn {
            position: absolute;
            top: -10px; right: -10px;
            background: #e74c3c; color: white;
            border-radius: 50%; width: 25px; height: 25px;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .rotate-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

    <h1>🔗 Logic Domino: Build the Chain</h1>

    <div class="dashboard">
        <div class="subtitle" id="subtitleText">Click 'Start Game' to build the knowledge chain!</div>
        <div class="controls" style="margin-top:15px;">
            <button onclick="startGame()">▶ Start Game</button>
            <button onclick="replayVoice()">🔊 Replay</button>
            <button onclick="slowVoice()">🐢 Slow</button>
        </div>
    </div>

    <div class="game-area">
        <!-- The Chain -->
        <div class="chain-board" id="chainBoard">
            <!-- Starting piece -->
            <div class="domino fixed" id="start-tile">
                <div class="half" onclick="speakWord('START')">START</div>
                <div class="half" onclick="speakWord('3 + 4')">3 + 4</div>
            </div>
            <!-- Drop zone for next piece -->
            <div class="drop-zone active" id="dropZone">Drop Here</div>
        </div>

        <!-- Available Tiles Tray -->
        <div class="tray" id="tray">
            <!-- Generated via JS -->
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let lastMessage = "";
        let isPlaying = false;
        let currentTargetMatch = "7"; // The right side of the starting tile implies looking for 7

        // Relationship Engine Data
        const relationships = {
            "3 + 4": { matches: "7", voice: "Three plus four equals seven. Mathematical equation!" },
            "7": { matches: "DOG", voice: "Wait, 7 doesn't match DOG." }, // Just a fallback, handled in logic
            "DOG": { matches: "ANIMAL", voice: "Dog belongs to the animal category. Classification!" },
            "ANIMAL": { matches: "1/2", voice: "No match." },
            "1/2": { matches: "50%", voice: "One half is equal to fifty percent. Equivalent fractions!" },
            "50%": { matches: "EGG", voice: "No match." },
            "EGG": { matches: "CATERPILLAR", voice: "An egg hatches into a caterpillar. Life cycle science!" }
        };

        const tilesData = [
            { id: "tile-1", left: "7", right: "DOG" },
            { id: "tile-2", left: "ANIMAL", right: "1/2" },
            { id: "tile-3", left: "50%", right: "EGG" },
            { id: "tile-4", left: "CATERPILLAR", right: "GOAL" }
        ];

        function speak(text, rate = 1.0) {
            synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate;
            synth.speak(utterance);
            lastMessage = text;
            document.getElementById('subtitleText').innerText = text;
        }

        function speakWord(word) {
            if(!isPlaying) return;
            speak(word);
        }

        function replayVoice() { if (lastMessage) speak(lastMessage, 1.0); }
        function slowVoice() { if (lastMessage) speak(lastMessage, 0.6); }

        function startGame() {
            isPlaying = true;
            currentTargetMatch = "7"; // Reset target
            
            // Reset Board
            document.getElementById('chainBoard').innerHTML = `
                <div class="domino fixed" id="start-tile">
                    <div class="half" onclick="speakWord('START')">START</div>
                    <div class="half" onclick="speakWord('3 + 4')">3 + 4</div>
                </div>
                <div class="drop-zone active" id="dropZone">Drop Here</div>
            `;
            
            setupDropZone();
            generateTiles();
            
            speak("Welcome to Logic Domino! Match the correct sides, build the chain, and reach the GOAL. Ready? Let’s build the chain!");
        }

        function generateTiles() {
            const tray = document.getElementById('tray');
            tray.innerHTML = "";
            
            let shuffled = [...tilesData].sort(() => Math.random() - 0.5);

            shuffled.forEach(data => {
                let dom = document.createElement('div');
                dom.className = 'domino';
                dom.id = data.id;
                dom.draggable = true;
                dom.dataset.left = data.left;
                dom.dataset.right = data.right;
                
                dom.innerHTML = `
                    <div class="rotate-btn" onclick="flipTile(event, '${data.id}')">🔄</div>
                    <div class="half left-side" onclick="speakWord('${data.left}')">${data.left}</div>
                    <div class="half right-side" onclick="speakWord('${data.right}')">${data.right}</div>
                `;
                
                dom.addEventListener('dragstart', dragStart);
                tray.appendChild(dom);
            });
        }

        function flipTile(e, id) {
            e.stopPropagation();
            if(!isPlaying) return;
            
            let dom = document.getElementById(id);
            let oldLeft = dom.dataset.left;
            let oldRight = dom.dataset.right;
            
            // Swap dataset
            dom.dataset.left = oldRight;
            dom.dataset.right = oldLeft;
            
            // Swap visual
            dom.querySelector('.left-side').innerText = oldRight;
            dom.querySelector('.left-side').setAttribute('onclick', `speakWord('${oldRight}')`);
            
            dom.querySelector('.right-side').innerText = oldLeft;
            dom.querySelector('.right-side').setAttribute('onclick', `speakWord('${oldLeft}')`);

            speak("Flipped.");
        }

        let draggedTile = null;

        function dragStart(e) {
            if(!isPlaying) { e.preventDefault(); return; }
            draggedTile = this;
            setTimeout(() => this.style.opacity = "0.5", 0);
        }

        function setupDropZone() {
            const dropZone = document.getElementById('dropZone');
            if(!dropZone) return;
            dropZone.addEventListener('dragover', e => e.preventDefault());
            dropZone.addEventListener('dragenter', function(e) { e.preventDefault(); this.classList.add('hover'); });
            dropZone.addEventListener('dragleave', function() { this.classList.remove('hover'); });
            dropZone.addEventListener('drop', handleDrop);
        }

        function checkMatch(openEnd, pieceLeft) {
            // Relationship Engine Logic
            if(relationships[openEnd] && relationships[openEnd].matches === pieceLeft) {
                return { isValid: true, voice: relationships[openEnd].voice };
            }
            if(openEnd === pieceLeft) { // Exact match fallback
                return { isValid: true, voice: `${openEnd} matches ${pieceLeft}.` };
            }
            return { isValid: false, voice: "Check both sides again. These two values do not match." };
        }

        function handleDrop(e) {
            this.classList.remove('hover');
            if(!isPlaying || !draggedTile) return;
            
            draggedTile.style.opacity = "1";
            let pieceLeft = draggedTile.dataset.left;
            let pieceRight = draggedTile.dataset.right;

            let matchResult = checkMatch(currentTargetMatch, pieceLeft);

            if(matchResult.isValid) {
                // Success
                speak("Great match! " + matchResult.voice);
                
                // Move tile to board
                draggedTile.draggable = false;
                draggedTile.classList.add('fixed');
                draggedTile.querySelector('.rotate-btn').style.display = 'none'; // Hide rotate button
                
                let board = document.getElementById('chainBoard');
                board.insertBefore(draggedTile, this); // Insert before drop zone
                
                currentTargetMatch = pieceRight; // New open end

                if(currentTargetMatch === "GOAL") {
                    this.style.display = 'none'; // Hide drop zone
                    isPlaying = false;
                    setTimeout(() => {
                        speak("Congratulations! You built the complete Knowledge Chain! You are a Domino Master.");
                    }, 4000);
                }

            } else {
                // Fail
                // Check if flipping would work
                let reverseMatch = checkMatch(currentTargetMatch, pieceRight);
                if(reverseMatch.isValid) {
                    speak("Almost! Try flipping the tile first.");
                } else {
                    speak(matchResult.voice);
                }
            }
            draggedTile = null;
        }
    </script>
</body>
</html>
