<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game #10 - Tactical Tic-Tac-Toe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #f1c40f; }

        .dashboard {
            margin-bottom: 20px;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            min-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .subtitle { font-size: 20px; margin-top: 10px; min-height: 40px; color: #3498db; }
        .controls button {
            padding: 10px 20px; margin: 0 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 5px;
            background: #e67e22; color: white; transition: 0.2s;
        }
        .controls button:hover { background: #d35400; }

        .game-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            opacity: 0.3;
            pointer-events: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            background-color: #f1c40f;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: #34495e;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background-color: #2c3e50; }
        
        .cell.x { color: #e74c3c; }
        .cell.o { color: #3498db; }
        
        .cell.correct {
            background-color: #2ecc71;
            color: white;
            animation: pulse 1s infinite;
        }

        .cell.wrong {
            background-color: #e74c3c;
            color: white;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .status { margin-top: 30px; font-size: 24px; color: #2ecc71; font-weight: bold; }
        
        .hint-text {
            margin-top: 15px;
            font-size: 18px;
            color: #ecf0f1;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>⚔️ Tactical Tic-Tac-Toe: Think Before You Move</h1>

    <div class="dashboard">
        <div class="subtitle" id="subtitleText">Click 'Start Game' to load the tactical puzzle!</div>
        <div class="controls" style="margin-top:15px;">
            <button onclick="startGame()">▶ Start Game</button>
            <button onclick="replayVoice()">🔊 Replay Voice</button>
        </div>
        <div class="hint-text" id="hintText"></div>
    </div>

    <div class="game-area" id="gameArea">
        <div class="board" id="board">
            <!-- Cells generated by JS -->
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let lastMessage = "";
        let isPlaying = false;

        // Puzzle Configuration
        // 0: Empty, 'X', 'O'
        // Goal: It's X's turn. Find the best move to block O.
        // O has (0,1) and (1,1). The block is at (2,1).
        const boardState = [
            ['X', 'O', 'X'],
            ['',  'O', ''],
            ['',  '',  '']
        ];

        function speak(text) {
            synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            synth.speak(utterance);
            lastMessage = text;
            document.getElementById('subtitleText').innerText = text;
        }

        function replayVoice() { if (lastMessage) speak(lastMessage); }

        function startGame() {
            isPlaying = true;
            document.getElementById('gameArea').style.opacity = "1";
            document.getElementById('gameArea').style.pointerEvents = "auto";
            document.getElementById('hintText').innerText = "Hint: Check whether your opponent can win on their next turn.";
            
            renderBoard();

            speak("Welcome to Tactical Tic-Tac-Toe! It is your turn to play as X. Think carefully. Your opponent, O, is planning something. Find the best move to protect your board.");
        }

        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = "";
            
            for(let r=0; r<3; r++) {
                for(let c=0; c<3; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    if(boardState[r][c] !== '') {
                        cell.innerText = boardState[r][c];
                        cell.classList.add(boardState[r][c].toLowerCase());
                    } else {
                        cell.onclick = () => handleMove(r, c, cell);
                    }
                    boardDiv.appendChild(cell);
                }
            }
        }

        function handleMove(r, c, cellElement) {
            if(!isPlaying) return;
            
            // Player is 'X'
            cellElement.innerText = 'X';
            cellElement.classList.add('x');
            isPlaying = false; // Wait for evaluation

            // Tactical Evaluator Engine Logic
            if(r === 2 && c === 1) {
                // Correct Move (Block)
                cellElement.classList.add('correct');
                speak("Excellent defense! You placed your mark in the bottom-middle square and blocked your opponent's winning column. That is a brilliant tactical move!");
                document.getElementById('hintText').innerText = "Puzzle Solved! You successfully identified the threat and neutralized it.";
            } else {
                // Weak/Losing Move
                cellElement.classList.add('wrong');
                
                // Show where the opponent will win
                let winningCell = document.getElementById('board').children[2*3 + 1]; // (2,1)
                winningCell.innerText = 'O';
                winningCell.classList.add('o', 'correct');
                
                speak("That move is legal, but there was a much stronger option. You missed a block! Your opponent just placed their mark in the middle column and won the game. Press Start Game to try again.");
                document.getElementById('hintText').innerText = "Turning Point: Failing to block immediate threats leads to a loss.";
            }
        }
    </script>
</body>
</html>
